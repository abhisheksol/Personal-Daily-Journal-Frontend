<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <script>try{const t=localStorage.getItem('journal_theme')||'system';const d=t==='system'?matchMedia('(prefers-color-scheme: light)').matches?'light':'dark':t;document.documentElement.dataset.theme=d}catch{document.documentElement.dataset.theme='dark'}</script>
    <meta name="description" content="A private, peaceful space to reflect on your days." />
    <title>Daily Journal — Your story, one day at a time</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
